name: Portfolio checks
on: [push, pull_request]
jobs:
  signal-processing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biomechanics-signal-processing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2' scipy matplotlib
      - run: python -m unittest discover -s tests -v
  gait-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gait-analysis-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib
      - run: python -m unittest discover -s tests -v
      - run: python marcha.py
